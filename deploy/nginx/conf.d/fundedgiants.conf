# Nginx Reverse Proxy Configuration for FundedGiants Production
# Domains:
#   - api.fundedgiants.ng     -> NestJS API (:4000)
#   - trader.fundedgiants.ng  -> Next.js Trader Dashboard (:3000)
#   - admin.fundedgiants.ng   -> Next.js Admin Portal (:3001)

# HTTP -> HTTPS Redirection & ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name api.fundedgiants.ng trader.fundedgiants.ng admin.fundedgiants.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 1. API Service (api.fundedgiants.ng)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.fundedgiants.ng;

    ssl_certificate /etc/letsencrypt/live/api.fundedgiants.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fundedgiants.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }
}

# 2. Trader Dashboard (trader.fundedgiants.ng)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trader.fundedgiants.ng;

    ssl_certificate /etc/letsencrypt/live/trader.fundedgiants.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trader.fundedgiants.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://trader-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Admin Portal (admin.fundedgiants.ng)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.fundedgiants.ng;

    ssl_certificate /etc/letsencrypt/live/admin.fundedgiants.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.fundedgiants.ng/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://admin-web:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
